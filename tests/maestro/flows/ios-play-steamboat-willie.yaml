appId: ${MAESTRO_APP_ID}
name: IOSPlaySteamboatWillie
---
# Log in on iOS, then play a fixture movie from the Movies library.
- runFlow: ios-simple-flow.yaml

# Take screenshot of home screen
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/07-home-screen

# Open the Library tab, then the Movies library. The home screen may not mount
# every fixture movie, so this route is more deterministic than tapping Home.
- tapOn:
    text: "Library"
- extendedWaitUntil:
    visible:
      id: "${MAESTRO_MOVIES_LIBRARY_ID}"
    timeout: 15000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/08-library-tab
- tapOn:
    id: "${MAESTRO_MOVIES_LIBRARY_ID}"

# Tap on Steamboat Willie movie
- extendedWaitUntil:
    visible:
      id: "${MAESTRO_STEAMBOAT_WILLIE_ID}"
    timeout: 15000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/09-movies-library
- tapOn:
    id: "${MAESTRO_STEAMBOAT_WILLIE_ID}"

# Wait for item detail screen and take screenshot
- extendedWaitUntil:
    visible:
      id: "play-button"
    timeout: 10000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/10-movie-detail

# Tap the play button
- tapOn:
    id: "play-button"

# Wait for player to load
- extendedWaitUntil:
    visible:
      id: "video-player"
    timeout: 30000

# Dismiss iOS player controls after playback starts.
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 1000

# Take screenshot of playing video
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/11-playing

# Wait a bit to let video actually start playing
- waitForAnimationToEnd:
    timeout: 5000

# Take final screenshot
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/12-playing-5s
